# Application bindings
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
# $terminal = uwsm-app -- xdg-terminal-exec
$terminal = uwsm-app -- ghostty -e sh -c "tmux attach || tmux"
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus signal "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus "^obsidian$" "uwsm-app -- obsidian -disable-gpu --enable-wayland-ime"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# ========================================
# MIGRATED FROM i3 CONFIG
# ========================================

# Unbind conflicting Omarchy defaults to use i3 bindings instead
unbind = SUPER, j  # Omarchy: Toggle window split -> i3: Focus down
unbind = SUPER, J
unbind = SUPER, k  # Omarchy: Show keybindings -> i3: Focus up
unbind = SUPER, K
unbind = SUPER, l  # Omarchy: Toggle workspace layout -> i3: Focus right
unbind = SUPER, L
unbind = SUPER, s  # Omarchy: Toggle scratchpad -> i3: Toggle group (tabbed)
unbind = SUPER, S
unbind = SUPER, w  # Omarchy: Close window -> i3: Browser
unbind = SUPER, W

# Window management - Focus (vim keys)
bind = SUPER, h, movefocus, l
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u
bind = SUPER, l, movefocus, r

# Window management - Focus (arrow keys)
bind = SUPER, left, movefocus, l
bind = SUPER, down, movefocus, d
bind = SUPER, up, movefocus, u
bind = SUPER, right, movefocus, r

# Window management - Move windows (arrow keys)
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, down, movewindow, d
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, right, movewindow, r

# Window management - Move windows (vim-style, adjusted mapping)
bind = SUPER SHIFT, j, movewindow, l
bind = SUPER SHIFT, k, movewindow, d
bind = SUPER SHIFT, l, movewindow, u
bind = SUPER SHIFT, semicolon, movewindow, r

# Window management - Resize mode
bind = SUPER, r, submap, resize
submap = resize
binde = , h, resizeactive, -20 0
binde = , j, resizeactive, 0 20
binde = , k, resizeactive, 0 -20
binde = , l, resizeactive, 20 0
binde = , left, resizeactive, -50 0
binde = , down, resizeactive, 0 50
binde = , up, resizeactive, 0 -50
binde = , right, resizeactive, 50 0
bind = , return, submap, reset
bind = , escape, submap, reset
bind = SUPER, r, submap, reset
submap = reset

# Workspace switching
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move to workspace and follow
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Move to workspace silently (without switching focus)
# bind = SUPER CTRL, 1, movetoworkspacesilent, 1
# bind = SUPER CTRL, 2, movetoworkspacesilent, 2
# bind = SUPER CTRL, 3, movetoworkspacesilent, 3
# bind = SUPER CTRL, 4, movetoworkspacesilent, 4
# bind = SUPER CTRL, 5, movetoworkspacesilent, 5
# bind = SUPER CTRL, 6, movetoworkspacesilent, 6
# bind = SUPER CTRL, 7, movetoworkspacesilent, 7
# bind = SUPER CTRL, 8, movetoworkspacesilent, 8
# bind = SUPER CTRL, 9, movetoworkspacesilent, 9
# bind = SUPER CTRL, 0, movetoworkspacesilent, 10

# Layout and window states
# bind = SUPER, f, fullscreen, 0  # Already defined in Omarchy defaults
bind = SUPER SHIFT, space, togglefloating
bind = SUPER SHIFT, q, killactive

# Split orientation (Note: Hyprland handles splits differently than i3)
# In i3: Super+z for horizontal split, Super+v for vertical split
# In Hyprland, splits are automatic based on window size ratio
# You can use layoutmsg to control dwindle/master layouts
bind = SUPER SHIFT, h, layoutmsg, togglesplit  # Toggle split direction (horizontal/vertical)

# Layout switching (i3 had stacking/tabbed/split toggle)
# Hyprland uses different layout systems (dwindle, master)
bind = SUPER, s, togglegroup  # Creates tabbed-like grouped windows
bind = SUPER, e, changegroupactive  # Cycle through grouped windows

# Audio controls
binde = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +10%
binde = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -10%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle

# Screenshots (using omarchy's Wayland-native screenshot tool)
bind = , Print, exec, omarchy-cmd-screenshot fullscreen
bind = SHIFT, Print, exec, omarchy-cmd-screenshot region
bindd = SUPER SHIFT, s, Screenshot to clipboard, exec, omarchy-cmd-screenshot smart clipboard

# Gammastep / Night Light controls
# SHIFT + brightness keys to control color temperature
bindd = SHIFT, XF86MonBrightnessUp, Night light warmer, exec, gammastep-control decrease
bindd = SHIFT, XF86MonBrightnessDown, Night light cooler, exec, gammastep-control increase
bindd = SUPER, XF86MonBrightnessUp, Night light toggle, exec, gammastep-control toggle
bindd = SUPER, XF86MonBrightnessDown, Night light toggle, exec, gammastep-control toggle

# Hyprsunset night light temperature (SUPER CTRL + arrows)
bindd = SUPER CTRL, up, Night light cooler, exec, hyprctl hyprsunset temperature $(($(hyprctl hyprsunset temperature | grep -oE '[0-9]+') + 500))
bindd = SUPER CTRL, down, Night light warmer, exec, hyprctl hyprsunset temperature $(($(hyprctl hyprsunset temperature | grep -oE '[0-9]+') - 500))

# Power management / System mode
bind = SUPER SHIFT, e, submap, system
submap = system
# Lock, exit, suspend, hibernate, reboot, shutdown
bind = , l, exec, loginctl lock-session
bind = , l, submap, reset
bind = , e, exec, hyprctl dispatch exit
bind = , e, submap, reset
bind = , s, exec, systemctl suspend
bind = , s, submap, reset
bind = , h, exec, systemctl hibernate
bind = , h, submap, reset
bind = , r, exec, systemctl reboot
bind = , r, submap, reset
bind = SHIFT, s, exec, systemctl poweroff
bind = SHIFT, s, submap, reset
bind = , return, submap, reset
bind = , escape, submap, reset
submap = reset

# Application launchers and basic apps from i3 config
# Note: SUPER+Return is defined at the top of this file with $terminal
# If you want to use the i3 config's kitty+tmux instead, comment out line 5 and uncomment below:
# bindd = SUPER, return, Terminal (tmux), exec, kitty /bin/zsh -c tmux

bindd = SUPER, d, File manager (pcmanfm), exec, pcmanfm

bindd = SUPER, w, Browser (LibreWolf), exec, librewolf

# Hyprland config management
bind = SUPER SHIFT, c, exec, hyprctl reload
bind = SUPER SHIFT, r, exec, hyprctl reload
# Moved to ~/.tmux.conf to avoid blocking Ctrl+F in browser
# bind = CTRL, F, exec, tmux send-keys "tmux-sessionizer" Enter

# ========================================
# END OF i3 CONFIG MIGRATION
